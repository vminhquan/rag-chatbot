services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: rag-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    # Trong container, 127.0.0.1 là chính backend. Dùng tên service Docker
    # "llama" để gọi sang llama-server qua mạng nội bộ Compose.
    environment:
      LLAMA_BASE_URL: http://llama:8080/v1

    depends_on:
      - llama


  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile

    container_name: rag-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

  llama:
    build:
      context: ./llama
      dockerfile: Dockerfile

    container_name: llama-server

    # Chỉ backend cần gọi LLM; không publish cổng này ra máy host.
    expose:
      - "8080"

    volumes:
      - /Users/vominhquan/llama.cpp/models:/models:ro
