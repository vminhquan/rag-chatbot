services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: rag-backend

    ports:
      - "8000:8000"

    env_file:
      - .env


  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile

    container_name: rag-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend
